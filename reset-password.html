<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Şifre yenile / Reset password — PlayOnSport</title><script src="/reset-password.js"></script><link rel="stylesheet" href="/styles.css"></head>
<body class="min-h-screen bg-slate-950 text-white p-6"><main class="mx-auto max-w-md py-12"><img src="/logo-main.png" alt="PlayOnSport" class="w-40 mb-8"><h1 class="text-2xl font-black">Yeni şifre / New password</h1><p class="mt-3 text-slate-300">En az 12 karakter kullanın. / Use at least 12 characters.</p>
<form id="resetForm" class="mt-6 space-y-4">
<label class="block">Yeni şifre / New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-900 p-3"></label>
<label class="block">Şifreyi tekrar yaz / Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-900 p-3"></label>
<button id="resetButton" type="submit" class="w-full rounded-xl bg-blue-600 p-3 font-bold">Şifreyi kaydet / Save password</button></form><p id="resetStatus" role="status" aria-live="polite" class="mt-6 text-slate-300"></p><a href="/" class="mt-6 inline-block text-blue-300">Siteye dön / Return to site</a></main></body></html>
