<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />

  <style>
    body {

      text-align: center;
    }

    .container {
      max-width: 520px;

      line-height: 1.5;
      color: #d8e3f5;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);

    .btn {

      text-decoration: none;
      padding: 17px 20px;
      border-radius: 14px;
      margin: 14px 0;

      font-weight: bold;

      color: #07142b;
    }

    .android {
      background: #20c45a;

      </p>

      <a class="btn ios"

        iPhone için indir

      <a class="btn android"
         href="https://play.google.com/store/apps/details?id=com.playonsport.voleybolbilgitesti">
        Android için indir
      </a>

      <div class="small">
