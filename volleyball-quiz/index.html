<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Voleybol Bilgi Testi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #020814;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .hero {
      width: 100%;
      display: block;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    .buttons {
      max-width: 330px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .btn {
      display: block;
      text-decoration: none;
      border-radius: 18px;
      padding: 24px 18px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
    }

    .ios {
      background: #ffffff;
      color: #07142b;
    }

    .android {
      background: #20c45a;
      color: #04150a;
    }

    @media (max-width: 600px) {
      .page {
        padding: 8px;
        align-items: flex-start;
      }

      .hero {
        border-radius: 10px;
        margin-bottom: 22px;
      }

      .buttons {
        max-width: 310px;
        gap: 22px;
      }

      .btn {
        font-size: 23px;
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="container">

      <img
        src="./hero.png"
        alt="Voleybol Bilgi Testi"
        class="hero"
      />

      <div class="buttons">
        <a
          class="btn ios"
          href="https://apps.apple.com/app/voleybol-bilgi-testi/id6805488142"
          target="_blank"
          rel="noopener noreferrer"
        >
          iPhone için indir
        </a>

        <a
          class="btn android"
          href="https://play.google.com/store/apps/details?id=com.playonsport.voleybolbilgitesti"
          target="_blank"
          rel="noopener noreferrer"
        >
          Android için indir
        </a>
      </div>

    </section>
  </main>
</body>
</html>
