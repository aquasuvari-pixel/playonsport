<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Voleybol Bilgi Testi | PlayOnSport</title>
  <meta name="description" content="Voleybol Bilgi Testi uygulamasını iPhone veya Android cihazına indir." />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #020814;
      color: white;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 980px;
      text-align: center;
    }

    .hero {
      width: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      margin-bottom: 22px;
    }

    .buttons {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      text-decoration: none;
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .ios {
      background: #ffffff;
      color: #07142b;
    }

    .android {
      background: #20c45a;
      color: #04150a;
    }

    @media (max-width: 600px) {
      .page {
        padding: 10px;
        align-items: flex-start;
      }

      .hero {
        border-radius: 12px;
        margin-bottom: 16px;
      }

      .btn {
        font-size: 18px;
        padding: 16px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="container">

      <img
        src="./hero.png.png"
        alt="Voleybol Bilgi Testi"
        class="hero"
      />

      <div class="buttons">
        <a
          class="btn ios"
          href="https://apps.apple.com/app/voleybol-bilgi-testi/id6805488142"
          target="_blank"
          rel="noopener noreferrer"
        >
          iPhone için indir
        </a>

        <a
          class="btn android"
          href="https://play.google.com/store/apps/details?id=com.playonsport.voleybolbilgitesti"
          target="_blank"
          rel="noopener noreferrer"
        >
          Android için indir
        </a>
      </div>

    </section>
  </main>
</body>
</html>
